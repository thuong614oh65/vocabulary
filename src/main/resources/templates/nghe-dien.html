<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nghe điền câu (Dictation)</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- CSS riêng -->
    <link rel="stylesheet" th:href="@{/css/nghe-dien.css}">
</head>
<body>

<div class="nghe-dien-container">

    <div class="main-wrapper">

        <!-- =====================================================
             TIÊU ĐỀ
             ===================================================== -->
        <div class="header-section text-center">
            <div class="header-icon">🎧</div>
            <h1>NGHE ĐIỀN CÂU</h1>
            <p class="subtitle">Luyện tai nghe và kỹ năng chép chính tả tiếng Anh bằng AI</p>
        </div>

        <!-- =====================================================
             KHUNG CHỌN NGUỒN TỪ & TẠO BÀI
             ===================================================== -->
        <div class="card-box mb-4">
            <form th:action="@{/nghe-dien/tao}" method="post" id="formTaoBaiNghe">
                <div class="row align-items-center g-3">
                    <div class="col-md-5 col-12">
                        <label for="boId" class="form-label fw-bold text-secondary">
                            📚 Chọn bộ từ vựng:
                        </label>
                        <select name="boId" id="boId" class="form-select select-bo">
                            <option value="" th:selected="${boIdChon == null}">-- Toàn bộ từ vựng (<span th:text="${tongSoTu}">0</span> từ) --</option>
                            <option th:each="bo : ${dsBo}"
                                    th:value="${bo.id}"
                                    th:selected="${boIdChon != null && boIdChon == bo.id}"
                                    th:text="${bo.tenBo}">
                            </option>
                        </select>
                    </div>

                    <div class="col-md-3 col-12">
                        <label for="soCau" class="form-label fw-bold text-secondary">
                            🔢 Số lượng câu:
                        </label>
                        <select name="soCau" id="soCau" class="form-select select-bo">
                            <option value="10" th:selected="${soCauChon == 10}">10 câu</option>
                            <option value="15" th:selected="${soCauChon == null || soCauChon == 15}">15 câu (Chuẩn)</option>
                            <option value="20" th:selected="${soCauChon == 20}">20 câu</option>
                        </select>
                    </div>

                    <div class="col-md-4 col-12 d-flex gap-2 align-self-end">
                        <button type="submit" class="btn btn-primary btn-tao-bai w-100" id="btnTaoBai">
                            ✨ Tạo bài nghe mới
                        </button>
                        <a href="/" class="btn btn-outline-secondary btn-quay-ve">
                            🏠 Trang chủ
                        </a>
                    </div>
                </div>
            </form>

            <!-- Loading Spinner khi bấm tạo bài -->
            <div id="loadingBox" class="loading-state mt-3" style="display: none;">
                <div class="spinner-border text-primary spinner-border-sm" role="status"></div>
                <span class="ms-2 fw-semibold text-primary">🤖 AI đang tạo các câu luyện nghe chứa từ vựng của bạn, vui lòng đợi giây lát...</span>
            </div>
        </div>

        <!-- =====================================================
             THÔNG BÁO LỖI (NẾU CÓ)
             ===================================================== -->
        <div class="alert alert-danger shadow-sm rounded-3" th:if="${loi}" th:text="${loi}"></div>

        <!-- =====================================================
             KHU VỰC BÀI TẬP 15 CÂU NGHE ĐIỀN
             ===================================================== -->
        <div class="card-box exercise-box" id="exerciseBox" th:if="${rawCauNgheDien != null}">

            <!-- Hidden data từ AI -->
            <div id="dataRawCauNgheDien" style="display: none;" th:text="${rawCauNgheDien}"></div>

            <!-- Header danh sách câu -->
            <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2 pb-2 border-bottom">
                <h4 class="exercise-title mb-0">
                    📝 Bấm nghe và gõ lại chính xác câu tiếng Anh:
                </h4>
                <div class="badge-count bg-light text-dark px-3 py-2 rounded-pill border">
                    Tổng số câu: <span id="tongSoCauText" class="fw-bold text-primary">15</span>
                </div>
            </div>

            <!-- Danh sách các câu hỏi -->
            <div class="dictation-list" id="dictationList">
                <!-- Sẽ render động 15 câu bằng JS -->
            </div>

            <!-- Nút hành động -->
            <div class="action-buttons mt-4 d-flex gap-3 flex-wrap align-items-center">
                <button type="button" class="btn btn-success btn-cham-diem px-4 py-2 fw-bold" id="btnChamDiem">
                    ✅ Chấm điểm tất cả
                </button>

                <button type="button" class="btn btn-outline-secondary px-4 py-2" id="btnLamLai" style="display: none;">
                    🔄 Làm lại bài này
                </button>
            </div>

            <!-- Khung kết quả tổng kết -->
            <div class="result-box mt-4" id="resultBox" style="display: none;">
                <div class="result-header">
                    <span class="result-icon" id="resultIcon">🎉</span>
                    <h3 class="result-score mb-1" id="resultScore">Bạn đúng 0/15 câu</h3>
                    <p class="result-comment mb-0" id="resultComment">Rất tốt!</p>
                </div>
            </div>

        </div>

    </div>

</div>

<!-- Bootstrap 5 Bundle JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

<!-- JS riêng cho tính năng nghe điền -->
<script th:src="@{/js/nghe-dien.js(v=2)}"></script>

</body>
</html>
