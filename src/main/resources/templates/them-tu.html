<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thêm từ vựng</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/tra-hang-loat.css(v=2)}">
</head>

<body>

<div class="alert alert-success alert-toast"
     th:if="${session.thongBao}"
     th:text="${session.thongBao}">
</div>

<div class="container mt-4 mb-5" style="max-width: 950px;">

    <div class="main-card">

        <h2 class="text-center mb-4">
            THÊM TỪ VỰNG
        </h2>

        <!-- =====================================================
             VÙNG CHỌN ẢNH HOẶC FILE
             ===================================================== -->
        <input type="file"
               id="fileInput"
               accept="image/*, .pdf, .txt, .csv"
               style="display: none;">

        <div class="upload-section" id="dropZone">
            <div class="upload-icon">📷 / 📄</div>
            <div class="upload-title">Thêm từ bằng Ảnh hoặc File</div>
            <p class="upload-desc">Bấm vào đây để chọn ảnh/file, hoặc kéo thả, hoặc dán trực tiếp (Ctrl + V) ảnh chụp màn hình</p>
        </div>

        <!-- Khung hiển thị file đã chọn (mặc định ẩn) -->
        <div id="previewContainer" class="file-badge-container" style="display: none;">
            <div class="file-info">
                <img id="previewThumb" class="file-thumb" src="" alt="Thumbnail" style="display: none;">
                <div>
                    <span class="file-name" id="previewName"></span>
                    <span class="text-muted small ms-2" id="previewSize"></span>
                </div>
            </div>
            <div class="d-flex gap-2">
                <button type="button" class="btn btn-sm btn-success" id="btnTrichXuat">
                    ⚡ Trích xuất lại
                </button>
                <button type="button" class="btn btn-sm btn-outline-danger" id="btnXoaFile" title="Hủy chọn">
                    ✕
                </button>
            </div>
        </div>

        <!-- Loading Indicator (mặc định ẩn) -->
        <div id="loadingBox" class="loading-box" style="display: none;">
            <div class="spinner-border spinner-border-sm text-success" role="status"></div>
            <span id="loadingText">Đang nhận diện từ vựng từ ảnh bằng AI...</span>
        </div>

        <!-- =====================================================
             FORM TRA HÀNG LOẠT
             ===================================================== -->
        <form th:action="@{/tra-hang-loat}"
              method="post"
              th:object="${themTuDTO}">

            <label class="form-label fw-bold mb-2">
                Danh sách từ vựng (Mỗi dòng một từ):
            </label>

            <textarea
                    id="noiDung"
                    class="form-control"
                    rows="10"
                    th:field="*{noiDung}"
                    placeholder="hello&#10;apple&#10;computer&#10;(Hoặc thêm ảnh/file ở trên để hệ thống tự điền)"></textarea>

            <div class="mt-4 d-flex gap-2 flex-wrap">
                <button
                        type="submit"
                        class="btn btn-primary px-4">
                    🔍 Tra hàng loạt
                </button>

                <a href="/"
                   class="btn btn-secondary">
                    🏠 Trang chủ
                </a>

                <a href="/quan-ly-tu"
                   class="btn btn-outline-success">
                    📋 Quản lí từ
                </a>
            </div>

        </form>

    </div>

    <!-- =====================================================
         FORM LƯU BỘ TỪ (KẾT QUẢ TRA TỪ)
         ===================================================== -->
    <form action="/luu-bo"
          method="post">

        <div class="main-card mt-4"
             th:if="${ketQua != null}">

            <h4 class="mb-3 text-success fw-bold">
                KẾT QUẢ TRA TỪ (<span th:text="${ketQua.size()}">0</span> từ)
            </h4>

            <div class="table-responsive shadow-sm rounded-3">
                <table class="table table-bordered align-middle">

                    <thead>
                    <tr>
                        <th style="width: 60px;">STT</th>
                        <th style="width: 200px;">English</th>
                        <th style="width: 250px;">Nghĩa</th>
                        <th style="width: 180px;">Phiên âm</th>
                        <th>Ví dụ</th>
                    </tr>
                    </thead>

                    <tbody>
                    <tr th:each="tu, stt : ${ketQua}">

                        <td class="text-center text-muted" th:text="${stt.count}"></td>

                        <td>
                            <input
                                    type="hidden"
                                    name="tiengAnh"
                                    th:value="${tu.tiengAnh}">
                            <strong th:text="${tu.tiengAnh}"></strong>
                        </td>

                        <td>
                            <input
                                    class="form-control"
                                    name="tiengViet"
                                    th:value="${tu.tiengViet}">
                        </td>

                        <td>
                            <input
                                    class="form-control"
                                    name="phienAm"
                                    th:value="${tu.phienAm}">
                        </td>

                        <td>
                            <input
                                    class="form-control"
                                    name="viDu"
                                    th:value="${tu.viDu}">
                        </td>

                    </tr>
                    </tbody>

                </table>
            </div>

            <div class="mt-3">
                <button
                        type="submit"
                        class="btn btn-success px-4 py-2 fw-bold">
                    💾 Lưu tất cả vào bộ từ
                </button>
            </div>

        </div>

    </form>

</div>

<!-- Bootstrap 5 Bundle JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

<script th:src="@{/js/tra-hang-loat.js(v=2)}"></script>

</body>
</html>
