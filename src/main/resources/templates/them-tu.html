<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Thêm từ</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          th:href="@{/css/tra-hang-loat.css}">
</head>

<body>

<div
        class="alert alert-success"
        th:if="${session.thongBao}"
        th:text="${session.thongBao}">
</div>

<div class="container mt-4">

    <h2 class="text-center mb-4">
        THÊM TỪ VỰNG
    </h2>


    <!-- =====================================================
         FORM TRA HÀNG LOẠT
         ===================================================== -->

    <form th:action="@{/tra-hang-loat}"
          method="post"
          th:object="${themTuDTO}">

        <label class="form-label">
            Mỗi dòng một từ
        </label>

        <textarea
                class="form-control"
                rows="15"
                th:field="*{noiDung}"
                placeholder="hello&#10;apple&#10;computer"></textarea>

        <div class="mt-4">

            <button
                    type="submit"
                    class="btn btn-primary">

                Tra hàng loạt

            </button>

            <a href="/"
               class="btn btn-secondary">

                Trang chủ

            </a>

        </div>

    </form>


    <!-- =====================================================
         FORM LƯU BỘ TỪ
         ===================================================== -->

    <form action="/luu-bo"
          method="post">

        <div class="mt-5"
             th:if="${ketQua != null}">

            <table class="table table-bordered">

                <thead>
                <tr>
                    <th>STT</th>
                    <th>English</th>
                    <th>Nghĩa</th>
                    <th>Phiên âm</th>
                    <th>VD</th>
                </tr>
                </thead>


                <tbody>

                <tr th:each="tu, stt : ${ketQua}">

                    <td th:text="${stt.count}">
                    </td>


                    <td>

                        <input
                                type="hidden"
                                name="tiengAnh"
                                th:value="${tu.tiengAnh}">

                        <span
                                th:text="${tu.tiengAnh}">
                        </span>

                    </td>


                    <td>

                        <input
                                class="form-control"
                                name="tiengViet"
                                th:value="${tu.tiengViet}">

                    </td>


                    <td>

                        <input
                                class="form-control"
                                name="phienAm"
                                th:value="${tu.phienAm}">

                    </td>


                    <td>

                        <input
                                class="form-control"
                                name="viDu"
                                th:value="${tu.viDu}">

                    </td>

                </tr>

                </tbody>

            </table>


            <button
                    type="submit"
                    class="btn btn-success">

                Lưu

            </button>

        </div>

    </form>


</div>


<script th:src="@{/js/tra-hang-loat.js}">
</script>

</body>

</html>
