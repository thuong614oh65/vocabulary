<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Học từ vựng</title>


    <!-- Bootstrap -->

    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
            rel="stylesheet">


    <!-- CSS riêng -->

    <link
            rel="stylesheet"
            th:href="@{/css/trang-chu.css}">

</head>


<body>


<div class="trang-chu">


    <!-- ==============================
         KHUNG CHÍNH
         ============================== -->

    <div class="khung">


        <!-- Tiêu đề -->

        <div class="tieu-de">

            <div class="icon">
                📚
            </div>

            <h1>
                HỌC TỪ VỰNG
                <br>
                TIẾNG ANH
            </h1>

            <p>
                Học từ vựng theo cách đơn giản và hiệu quả
            </p>

        </div>


        <!-- ==============================
             CÁC NÚT CHỨC NĂNG
             ============================== -->

        <div class="cac-nut">


            <!-- Thêm từ -->

            <a
                    href="/them-tu"
                    class="nut nut-them">

                <span class="nut-icon">
                    ➕
                </span>

                <span>
                    Thêm từ
                </span>

            </a>


            <!-- Học -->

            <a
                    href="/hoc"
                    class="nut nut-hoc">

                <span class="nut-icon">
                    📖
                </span>

                <span>
                    Học
                </span>

            </a>


            <!-- Đăng xuất -->

            <a
                    href="/dangxuat"
                    class="nut nut-dang-xuat">

                <span class="nut-icon">
                    🚪
                </span>

                <span>
                    Đăng xuất
                </span>

            </a>


        </div>


    </div>


</div>


</body>

</html>
