<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Học từ vựng</title>


    <!-- Bootstrap -->

    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
            rel="stylesheet">


    <!-- CSS riêng -->

    <link
            rel="stylesheet"
            th:href="@{/css/trang-chu.css}">

</head>


<body>


<div class="trang-chu">


    <!-- ==============================
         KHUNG CHÍNH
         ============================== -->

    <div class="khung">


        <!-- Tiêu đề -->

        <div class="tieu-de">

            <!-- Tên người đăng nhập hiển thị trên icon sách -->
            <div class="user-greeting-badge" th:if="${session.taiKhoan != null}">
                <span class="user-badge-icon">👤</span>
                <span class="user-badge-text">Xin chào, <strong th:text="${session.taiKhoan.hoTen != null && !session.taiKhoan.hoTen.isBlank() ? session.taiKhoan.hoTen : session.taiKhoan.tenDangNhap}">Học viên</strong></span>
            </div>

            <div class="icon">
                📚
            </div>

            <h1>
                HỌC TỪ VỰNG
                <br>
                TIẾNG ANH
            </h1>

            <p>
                Học từ vựng theo cách đơn giản và hiệu quả
            </p>

        </div>


        <!-- ==============================
             CÁC NÚT CHỨC NĂNG
             ============================== -->

        <div class="cac-nut">


            <!-- Thêm từ -->

            <a
                    href="/them-tu"
                    class="nut nut-them">

                <span class="nut-icon">
                    ➕
                </span>

                <span>
                    Thêm từ
                </span>

            </a>


            <!-- Học -->

            <a
                    href="/hoc"
                    class="nut nut-hoc">

                <span class="nut-icon">
                    📖
                </span>

                <span>
                    Học
                </span>

            </a>


            <!-- Bảng IPA -->

            <a
                    href="/ipa"
                    class="nut nut-ipa">

                <span class="nut-icon">
                    📢
                </span>

                <span>
                    Bảng IPA
                </span>

            </a>


            <!-- Số đếm (Numbers) -->

            <a
                    href="/so-dem"
                    class="nut nut-so-dem">

                <span class="nut-icon">
                    🔢
                </span>

                <span>
                    Số đếm (Numbers)
                </span>

            </a>


            <!-- Dịch đoạn văn -->

            <a
                    href="/dich-doan-van"
                    class="nut nut-dich">

                <span class="nut-icon">
                    📝
                </span>

                <span>
                    Dịch đoạn văn
                </span>

            </a>


            <!-- Điền chỗ trống -->

            <a
                    href="/dien-cho-trong"
                    class="nut nut-dien-tu">

                <span class="nut-icon">
                    ✏️
                </span>

                <span>
                    Điền chỗ trống
                </span>

            </a>


            <!-- Nghe điền câu -->

            <a
                    href="/nghe-dien"
                    class="nut nut-nghe-dien">

                <span class="nut-icon">
                    🎧
                </span>

                <span>
                    Nghe điền
                </span>

            </a>


            <!-- Luyện nói -->

            <a
                    href="/luyen-noi"
                    class="nut nut-luyen-noi">

                <span class="nut-icon">
                    🎙️
                </span>

                <span>
                    Luyện nói
                </span>

            </a>


            <!-- Quản lí từ -->

            <a
                    href="/quan-ly-tu"
                    class="nut nut-quan-ly">

                <span class="nut-icon">
                    📋
                </span>

                <span>
                    Quản lí từ
                </span>

            </a>


            <!-- Đăng xuất -->

            <a
                    href="/dangxuat"
                    class="nut nut-dang-xuat">

                <span class="nut-icon">
                    🚪
                </span>

                <span>
                    Đăng xuất
                </span>

            </a>


        </div>


    </div>


</div>


</body>

</html>
