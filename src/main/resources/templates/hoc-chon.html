<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Học từ vựng</title>


    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
            rel="stylesheet">


    <link
            rel="stylesheet"
            th:href="@{/css/hoc-chon.css(v=6)}">

</head>


<body>

<div class="container mt-5">


    <h2 class="text-center">
        HỌC TỪ VỰNG
    </h2>


    <h4 class="text-center mt-3">
        English → Vietnamese
    </h4>


    <hr>


    <table class="table table-bordered">


        <thead>

        <tr>

            <th>Từ</th>

            <th>Nhập nghĩa</th>

            <!-- Chỉ hiện trên điện thoại -->

            <th class="cot-cham">
                ✓
            </th>

        </tr>

        </thead>


        <tbody>

        <tr th:each="tu : ${session.tuDangHoc}">


            <td>

                <div class="tu-hover">


                    <span
                            th:text="${tu.tiengAnh}">
                    </span>


                    <div class="thong-tin-tu">


                        <p>

                            Phiên âm:

                            <span
                                    th:text="${tu.phienAm}">
                            </span>

                        </p>


                        <button
                                type="button"
                                th:attr="onclick=|docTu('${tu.tiengAnh}')|">

                            🔊 Đọc

                        </button>


                    </div>


                </div>

            </td>


            <td>

                <input
                        type="text"
                        class="form-control cau-tra-loi"

                        th:data-id="${tu.id}"

                        th:data-tu="${tu.tiengAnh}"

                        th:data-dap-an="${tu.tiengViet}"
                >
                <div class="ket-qua mt-1"></div>
            </td>


            <!-- Nút chấm chỉ hiện trên điện thoại -->

            <td class="cot-cham">

                <button
                        type="button"
                        class="btn btn-success nut-cham"
                        onclick="chamDiemTuNut(this)">

                    ✓

                </button>

            </td>


        </tr>

        </tbody>

    </table>


    <div class="text-center mt-4">


        <button
                class="btn btn-primary"
                onclick="tiepLuot()">

            Tiếp

        </button>


        <button
                class="btn btn-danger"
                onclick="dungHoc()">

            Dừng

        </button>


    </div>

</div>


<script
        th:src="@{/js/hoc-chon.js(v=6)}">
</script>


</body>

</html>
