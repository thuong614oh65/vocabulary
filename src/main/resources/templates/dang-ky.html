<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Đăng ký tài khoản</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .container {
            width: 400px;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        h2 {
            text-align: center;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
        }

        input {
            width: 100%;
            box-sizing: border-box;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        button {
            width: 100%;
            padding: 11px;
            background: #2196f3;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background: #1976d2;
        }

        .loi {
            color: red;
            margin-bottom: 15px;
            text-align: center;
        }

        .login {
            text-align: center;
            margin-top: 20px;
        }

        .login a {
            color: #2196f3;
            text-decoration: none;
        }
    </style>
</head>

<body>

<div class="container">

    <h2>Đăng ký tài khoản</h2>

    <!-- Hiển thị lỗi -->
    <div class="loi"
         th:if="${loi}"
         th:text="${loi}">
    </div>

    <form method="post" action="/dangky">

        <div class="form-group">
            <label>Tên đăng nhập</label>

            <input type="text"
                   name="tenDangNhap"
                   placeholder="Nhập tên đăng nhập"
                   required>
        </div>

        <div class="form-group">
            <label>Mật khẩu</label>

            <input type="password"
                   name="matKhau"
                   placeholder="Nhập mật khẩu"
                   required>
        </div>

        <div class="form-group">
            <label>Họ tên</label>

            <input type="text"
                   name="hoTen"
                   placeholder="Nhập họ tên"
                   required>
        </div>

        <div class="form-group">
            <label>Email</label>

            <input type="email"
                   name="email"
                   placeholder="Nhập email">
        </div>

        <button type="submit">
            Đăng ký
        </button>

    </form>

    <div class="login">
        Đã có tài khoản?
        <a href="/dangnhap">Đăng nhập</a>
    </div>

</div>

</body>
</html>
