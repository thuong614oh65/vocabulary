<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Đăng ký tài khoản</title>

    <link rel="stylesheet"
          th:href="@{/css/tai-khoan.css}">
</head>

<body>

<div class="container">

    <h2>Đăng ký tài khoản</h2>

    <!-- Hiển thị lỗi -->
    <div class="loi"
         th:if="${loi}"
         th:text="${loi}">
    </div>

    <form method="post" action="/dangky">

        <div class="form-group">
            <label>Tên đăng nhập</label>

            <input type="text"
                   name="tenDangNhap"
                   placeholder="Nhập tên đăng nhập"
                   required>
        </div>

        <div class="form-group">
            <label>Mật khẩu</label>

            <input type="password"
                   name="matKhau"
                   placeholder="Nhập mật khẩu"
                   required>
        </div>

        <div class="form-group">
            <label>Họ tên</label>

            <input type="text"
                   name="hoTen"
                   placeholder="Nhập họ tên"
                   required>
        </div>

        <div class="form-group">
            <label>Email</label>

            <input type="email"
                   name="email"
                   placeholder="Nhập email">
        </div>

        <button type="submit">
            Đăng ký
        </button>

    </form>

    <div class="login">
        Đã có tài khoản?
        <a href="/dangnhap">Đăng nhập</a>
    </div>

</div>

</body>
</html>
