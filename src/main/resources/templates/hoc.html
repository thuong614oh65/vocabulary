<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Học</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet" th:href="@{/css/hoc.css(v=2)}">

</head>

<body>

<div class="container mt-5">

    <h2 class="text-center mb-4">
        HỌC TỪ VỰNG
    </h2>

    <form
            th:action="@{/hoc}"
            method="post"
            th:object="${hocDTO}">

        <!-- Ngẫu nhiên -->
        <div class="form-check">
            <input id="ngauNhien"
                   class="form-check-input"
                   type="radio"
                   th:field="*{kieuHoc}"
                   value="NGAU_NHIEN">

            <label class="form-check-label">
                Ngẫu nhiên
            </label>
        </div>

        <!-- Từ sai -->
        <div class="form-check">
            <input id="tuSai"
                   class="form-check-input"
                   type="radio"
                   th:field="*{kieuHoc}"
                   value="TU_SAI">

            <label class="form-check-label">
                Từ sai
            </label>
        </div>

        <!-- Theo bộ -->
        <div class="form-check">
            <input id="theoBo"
                   class="form-check-input"
                   type="radio"
                   th:field="*{kieuHoc}"
                   value="THEO_BO">

            <label class="form-check-label">
                Theo bộ
            </label>
        </div>

        <select id="boHoc"
                class="form-select mt-2"
                th:field="*{boId}"
                onchange="doiBo()">

            <option value="">
                Chọn bộ
            </option>

            <option
                    th:each="bo : ${dsBo}"
                    th:value="${bo.id}"
                    th:text="${bo.tenBo}">
            </option>

        </select>

        <!-- Chọn từng từ -->
        <div class="form-check mt-3">

            <input id="chonTu"
                   class="form-check-input"
                   type="radio"
                   th:field="*{kieuHoc}"
                   value="CHON_TUNG_TU">

            <label class="form-check-label">
                Chọn từng từ
            </label>

        </div>

        <div class="mt-4 d-flex gap-2 flex-wrap align-items-center btn-action-group">
            <button type="submit"
                    class="btn btn-success px-4 fw-bold">
                📖 Học
            </button>

            <a href="/"
               class="btn btn-secondary px-3">
                🏠 Trang chủ
            </a>

            <a href="/them-tu"
               class="btn btn-outline-primary px-3">
                ➕ Thêm từ
            </a>

            <a href="/quan-ly-tu"
               class="btn btn-outline-warning px-3"
               style="color: #b45309; border-color: #f59e0b;">
                📋 Quản lí từ
            </a>
        </div>

    <hr>

    <!-- ================= THEO BỘ ================= -->

    <div id="bangTheoBo" style="display:none;">

        <table class="table table-bordered table-hover">

            <thead>

            <tr>

                <th>Bộ</th>
                <th>English</th>
                <th>Nghĩa</th>
                <th>Phiên âm</th>
                <th>Đọc</th>

            </tr>

            </thead>

            <tbody>

            <tr th:each="tu,st : ${dsTheoBo}">

                <td
                        th:if="${st.index==0
                        or dsTheoBo.get(st.index-1).boTuVung.id!=tu.boTuVung.id}"

                        th:rowspan="${tu.boTuVung.soLuongTu}"

                        th:text="${tu.boTuVung.tenBo}">
                </td>

                <td th:text="${tu.tiengAnh}"></td>

                <td th:text="${tu.tiengViet}"></td>

                <td th:text="${tu.phienAm}"></td>

                <td>

                    <button
                            type="button"
                            th:attr="onclick=|docTu('${tu.tiengAnh}')|">

                        🔊

                    </button>

                </td>

            </tr>

            </tbody>

        </table>

    </div>

    <!-- ================= CHỌN TỪNG TỪ ================= -->

    <div id="bangTatCa" style="display:none;">

        <table class="table table-bordered table-hover">

            <thead>

            <tr>

                <th>Bộ</th>
                <th>English</th>
                <th>Nghĩa</th>
                <th>Phiên âm</th>
                <th>Đọc</th>
                <th>Chọn</th>

            </tr>

            </thead>

            <tbody>

            <tr th:each="tu,st : ${dsTatCa}">

                <td
                        th:if="${st.index==0
                        or dsTatCa.get(st.index-1).boTuVung.id!=tu.boTuVung.id}"

                        th:rowspan="${tu.boTuVung.soLuongTu}"

                        th:text="${tu.boTuVung.tenBo}">
                </td>

                <td th:text="${tu.tiengAnh}"></td>

                <td th:text="${tu.tiengViet}"></td>

                <td th:text="${tu.phienAm}"></td>

                <td>

                    <button
                            type="button"
                            th:attr="onclick=|docTu('${tu.tiengAnh}')|">

                        🔊

                    </button>

                </td>

                <td>

                    <input
                            type="checkbox"
                            name="tuIds"
                            th:value="${tu.id}">

                </td>

            </tr>

            </tbody>

        </table>

    </div>

    </form>


</div>

<script
        th:src="@{/js/hoc.js}">
</script>
</body>
</html>
