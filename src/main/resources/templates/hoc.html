<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Học</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet" th:href="@{/css/hoc.css(v=3)}">

</head>

<body>

<div class="container mt-5">

    <h2 class="text-center mb-4">
        HỌC TỪ VỰNG
    </h2>

    <form
            th:action="@{/hoc}"
            method="post"
            th:object="${hocDTO}">

        <!-- Ngẫu nhiên -->
        <div class="form-check">
            <input id="ngauNhien"
                   class="form-check-input"
                   type="radio"
                   th:field="*{kieuHoc}"
                   value="NGAU_NHIEN">

            <label class="form-check-label">
                Ngẫu nhiên
            </label>
        </div>

        <!-- Từ sai -->
        <div class="form-check">
            <input id="tuSai"
                   class="form-check-input"
                   type="radio"
                   th:field="*{kieuHoc}"
                   value="TU_SAI">

            <label class="form-check-label">
                Từ sai
            </label>
        </div>

        <!-- Theo bộ -->
        <div class="form-check">
            <input id="theoBo"
                   class="form-check-input"
                   type="radio"
                   th:field="*{kieuHoc}"
                   value="THEO_BO">

            <label class="form-check-label">
                Theo bộ
            </label>
        </div>

        <select id="boHoc"
                class="form-select mt-2"
                th:field="*{boId}"
                onchange="doiBo()">

            <option value="">
                Chọn bộ
            </option>

            <option
                    th:each="bo : ${dsBo}"
                    th:value="${bo.id}"
                    th:text="${bo.tenBo}">
            </option>

        </select>

        <!-- Tùy chọn phạm vi học trong bộ -->
        <div id="tuyChonPhamViBo" class="mt-3 p-3 rounded-3 border bg-light shadow-sm" style="display: none;">
            <div class="fw-bold mb-2 text-success">
                📚 Chọn phạm vi học trong bộ:
            </div>
            
            <div class="form-check mb-2">
                <input class="form-check-input"
                       type="radio"
                       name="phamViBo"
                       id="phamViTatCa"
                       value="TAT_CA"
                       th:checked="${hocDTO.phamViBo == null or hocDTO.phamViBo == 'TAT_CA'}"
                       onchange="capNhatPhamViBo()">
                <label class="form-check-label fw-bold" for="phamViTatCa">
                    Học tất cả các từ trong bộ (<span id="tongSoTuBo" th:text="${dsTheoBo != null ? dsTheoBo.size() : 0}">0</span> từ)
                </label>
            </div>

            <div class="form-check d-flex flex-wrap align-items-center gap-2">
                <input class="form-check-input"
                       type="radio"
                       name="phamViBo"
                       id="phamViTuDen"
                       value="TU_DEN"
                       th:checked="${hocDTO.phamViBo == 'TU_DEN'}"
                       onchange="capNhatPhamViBo()">
                <label class="form-check-label fw-bold me-2" for="phamViTuDen">
                    Học theo khoảng từ:
                </label>
                <div class="d-inline-flex align-items-center gap-2 flex-wrap mt-1 mt-sm-0">
                    <span>Từ số</span>
                    <input type="number"
                           id="tuTu"
                           name="tuTu"
                           class="form-control form-control-sm text-center fw-bold"
                           style="width: 75px;"
                           min="1"
                           th:value="${hocDTO.tuTu != null ? hocDTO.tuTu : 1}">
                    <span>đến số</span>
                    <input type="number"
                           id="denTu"
                           name="denTu"
                           class="form-control form-control-sm text-center fw-bold"
                           style="width: 75px;"
                           min="1"
                           th:value="${hocDTO.denTu != null ? hocDTO.denTu : (dsTheoBo != null and !dsTheoBo.isEmpty() ? dsTheoBo.size() : 10)}">
                </div>
            </div>
        </div>

        <!-- Chọn từng từ -->
        <div class="form-check mt-3">

            <input id="chonTu"
                   class="form-check-input"
                   type="radio"
                   th:field="*{kieuHoc}"
                   value="CHON_TUNG_TU">

            <label class="form-check-label">
                Chọn từng từ
            </label>

        </div>

        <div class="mt-4 d-flex gap-2 flex-wrap align-items-center btn-action-group">
            <button type="submit"
                    class="btn btn-success px-4 fw-bold">
                📖 Học
            </button>

            <a href="/"
               class="btn btn-secondary px-3">
                🏠 Trang chủ
            </a>

            <a href="/them-tu"
               class="btn btn-outline-primary px-3">
                ➕ Thêm từ
            </a>

            <a href="/quan-ly-tu"
               class="btn btn-outline-warning px-3"
               style="color: #b45309; border-color: #f59e0b;">
                📋 Quản lí từ
            </a>
        </div>

    <hr>

    <!-- ================= THEO BỘ ================= -->

    <div id="bangTheoBo" style="display:none;">

        <table class="table table-bordered table-hover">

            <thead>

            <tr>

                <th>Bộ</th>
                <th style="width: 60px;">STT</th>
                <th>English</th>
                <th>Nghĩa</th>
                <th>Phiên âm</th>
                <th>Đọc</th>

            </tr>

            </thead>

            <tbody>

            <tr th:each="tu,st : ${dsTheoBo}">

                <td
                        th:if="${st.index==0
                        or dsTheoBo.get(st.index-1).boTuVung.id!=tu.boTuVung.id}"

                        th:rowspan="${tu.boTuVung.soLuongTu}"

                        th:text="${tu.boTuVung.tenBo}">
                </td>

                <td class="text-center fw-bold text-secondary" th:text="${st.index + 1}"></td>

                <td th:text="${tu.tiengAnh}"></td>

                <td th:text="${tu.tiengViet}"></td>

                <td th:text="${tu.phienAm}"></td>

                <td>

                    <button
                            type="button"
                            th:attr="onclick=|docTu('${tu.tiengAnh}')|">

                        🔊

                    </button>

                </td>

            </tr>

            </tbody>

        </table>

    </div>

    <!-- ================= CHỌN TỪNG TỪ ================= -->

    <div id="bangTatCa" style="display:none;">

        <table class="table table-bordered table-hover">

            <thead>

            <tr>

                <th>Bộ</th>
                <th>English</th>
                <th>Nghĩa</th>
                <th>Phiên âm</th>
                <th>Đọc</th>
                <th>Chọn</th>

            </tr>

            </thead>

            <tbody>

            <tr th:each="tu,st : ${dsTatCa}">

                <td
                        th:if="${st.index==0
                        or dsTatCa.get(st.index-1).boTuVung.id!=tu.boTuVung.id}"

                        th:rowspan="${tu.boTuVung.soLuongTu}"

                        th:text="${tu.boTuVung.tenBo}">
                </td>

                <td th:text="${tu.tiengAnh}"></td>

                <td th:text="${tu.tiengViet}"></td>

                <td th:text="${tu.phienAm}"></td>

                <td>

                    <button
                            type="button"
                            th:attr="onclick=|docTu('${tu.tiengAnh}')|">

                        🔊

                    </button>

                </td>

                <td>

                    <input
                            type="checkbox"
                            name="tuIds"
                            th:value="${tu.id}">

                </td>

            </tr>

            </tbody>

        </table>

    </div>

    </form>


</div>

<script
        th:src="@{/js/hoc.js(v=3)}">
</script>
</body>
</html>
