<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Đăng nhập</title>

    <link rel="stylesheet"
          th:href="@{/css/tai-khoan.css}">
</head>

<body>

<div class="container">

    <h2>Đăng nhập</h2>

    <div class="loi"
         th:if="${loi}"
         th:text="${loi}">
    </div>

    <form method="post" action="/dangnhap">

        <div class="form-group">
            <label>Tên đăng nhập</label>

            <input type="text"
                   name="tenDangNhap"
                   placeholder="Nhập tên đăng nhập"
                   required>
        </div>

        <div class="form-group">
            <label>Mật khẩu</label>

            <input type="password"
                   name="matKhau"
                   placeholder="Nhập mật khẩu"
                   required>
        </div>

        <button type="submit">
            Đăng nhập
        </button>

    </form>

    <div class="register">
        Chưa có tài khoản?
        <a href="/dangky">Đăng ký</a>
    </div>

</div>

</body>
</html>
