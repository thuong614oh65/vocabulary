<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Lượt 2</title>


    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
          rel="stylesheet">


    <link rel="stylesheet"
          th:href="@{/css/hoc-luot2.css}">

</head>


<body>

<div class="container mt-5">


    <h2 class="text-center">
        HỌC TỪ VỰNG
    </h2>


    <h4 class="text-center mt-3">
        Vietnamese → English
    </h4>


    <hr>


    <table class="table table-bordered">


        <tr>

            <th>Nghĩa</th>

            <th>Nhập từ tiếng Anh</th>

            <!-- Chỉ hiện trên điện thoại -->

            <th class="cot-cham">
                ✓
            </th>

        </tr>


        <tr th:each="tu : ${dsHoc}">


            <td>

                <span th:text="${tu.tiengViet}">
                </span>

            </td>


            <td>


                <input
                        type="text"
                        class="form-control cau-tra-loi"

                        th:data-id="${tu.id}"

                        th:data-dap-an="${tu.tiengAnh}"
                >


                <div class="ket-qua mt-1"></div>


            </td>


            <!-- Nút chấm chỉ hiện trên điện thoại -->

            <td class="cot-cham">

                <button
                        type="button"
                        class="btn btn-success nut-cham"
                        onclick="chamDiemTuNut(this)">

                    ✓

                </button>

            </td>


        </tr>


    </table>


    <div class="text-center mt-4">


        <button
                class="btn btn-primary"
                onclick="tiepLuot()">

            Tiếp

        </button>


        <button
                class="btn btn-danger"
                onclick="dungHoc()">

            Dừng

        </button>


    </div>


</div>


<script th:src="@{/js/hoc-luot2.js}"></script>

</body>

</html>
