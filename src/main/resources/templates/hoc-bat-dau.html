<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Bắt đầu học</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="icon" type="image/x-icon" th:href="@{/favicon.ico}">

    <link rel="stylesheet"
          th:href="@{/css/bat-dau-hoc.css(v=2)}">
    <link rel="stylesheet"
          th:href="@{/css/huong-dan-doc.css(v=2)}">
</head>


<body>

<div class="container mt-5">


    <h2 class="text-center" th:text="${cheDoHoc == 'PHAN_XA' ? '⚡ BẮT ĐẦU LUYỆN PHẢN XẠ' : 'BẮT ĐẦU HỌC'}">
        BẮT ĐẦU HỌC
    </h2>


    <div class="card mt-4">

        <div class="card-body">


            <h5>
                Kiểu học:
                <span th:text="${hocDTO.kieuHoc}"></span>
            </h5>


            <h5 th:if="${hocDTO.boId != null}">
                Bộ:
                <span th:text="${hocDTO.boId}"></span>
            </h5>


            <h4 class="mt-4">
                <span th:if="${cheDoHoc == 'PHAN_XA'}">Các từ sẽ luyện phản xạ</span>
                <span th:unless="${cheDoHoc == 'PHAN_XA'}">Các từ sẽ học</span>
                <span th:if="${dsHoc != null}" th:text="'(' + ${dsHoc.size()} + ' từ)'" class="text-muted fs-6 fw-normal"></span>
            </h4>


            <table class="table table-bordered">


                <thead>

                <tr>

                    <th>
                        English
                    </th>

                    <th>
                        Nghĩa
                    </th>

                    <th>
                        Phiên âm
                    </th>

                    <th>
                        Đọc
                    </th>

                </tr>

                </thead>


                <tbody>


                <tr th:each="tu:${dsHoc}">


                    <td>
                        <div class="tu-don-wrap">
                            <span class="tu-don-text" th:text="${tu.tiengAnh}"></span>
                            <button type="button"
                                    class="btn-hd-icon"
                                    th:attr="onclick=|moHuongDanDoc(this, '${tu.tiengAnh}', '${tu.phienAm}', '${tu.tiengViet}')|"
                                    title="Xem hướng dẫn cách đọc chuẩn">
                                🗣️
                            </button>
                        </div>
                    </td>


                    <td th:text="${tu.tiengViet}">
                    </td>


                    <td th:text="${tu.phienAm}">
                    </td>


                    <td>

                        <button
                                type="button"
                                th:attr="onclick=|docTu('${tu.tiengAnh}')|">

                            🔊

                        </button>


                    </td>


                </tr>


                </tbody>


            </table>



            <div class="d-flex flex-wrap gap-3 mt-4 align-items-center">
                <!-- Chỉ hiện nút Bắt đầu học khi chọn Học -->
                <form th:if="${cheDoHoc != 'PHAN_XA'}" th:action="@{/bat-dau-hoc}" method="post" class="m-0">
                    <input type="hidden" name="kieuHoc" th:value="${hocDTO.kieuHoc}">
                    <button type="submit" class="btn btn-success px-4 py-2 fw-bold shadow-sm">
                        📖 Bắt đầu học
                    </button>
                </form>

                <!-- Chỉ hiện nút Luyện phản xạ khi chọn Luyện phản xạ -->
                <a th:if="${cheDoHoc == 'PHAN_XA'}"
                   href="/luyen-phan-xa?kieuHoc=DANG_HOC"
                   class="btn btn-warning px-4 py-2 fw-bold text-dark shadow-sm">
                    ⚡ Luyện phản xạ
                </a>

                <a href="/hoc" class="btn btn-outline-secondary px-3 py-2">
                    ← Chọn lại
                </a>

                <a th:href="@{/}" class="btn btn-secondary px-3 py-2">
                    🏠 Trang chủ
                </a>
            </div>


        </div>

    </div>


</div>


<script th:src="@{/js/global-audio.js(v=1)}"></script>
<script th:src="@{/js/hoc.js}"></script>
<script th:src="@{/js/huong-dan-doc.js(v=2)}"></script>


</body>

</html>
